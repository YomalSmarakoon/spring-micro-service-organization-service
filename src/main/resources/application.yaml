server:
  port: 8085

spring:
  application:
    name: organization-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8071
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://localhost:8080/realms/spmia-realm # Use localhost if your Spring app runs outside Docker
#          # Use keycloak if your Spring app runs inside Docker Compose with a service named keycloak: http://keycloak:8080/realms/spmia-realm
  cloud:
    stream:
      bindings:
        organizationChange-out-0:
          destination: orgChangeTopic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    version: 1.0.0

logging:
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

  level:
    root: INFO
    org.springframework: INFO
    com.optimagrowth: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans